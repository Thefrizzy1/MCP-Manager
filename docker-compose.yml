# Plutus MCP Server (MCP-Manager) — Docker Compose
#
# Pull & run (no local build) — uses the pre-built image from GHCR:
#   docker compose pull && docker compose up -d
# Or build locally instead:
#   docker compose up -d --build
#
# Quick start:
#   1. cp .env.example .env
#   2. Edit .env — at minimum set UI_PASSWORD (the rest are optional service
#      integrations; empty ones just stay inactive).
#   3. (optional) Uncomment a host path under "volumes" to expose it to the
#      filesystem tools, and add the same in-container path to
#      FILESYSTEM_ALLOWED_PATHS in .env.
#   4. docker compose up -d
#
#   Dashboard: http://<host>:8766/ui   ·   MCP: http://<host>:8765/mcp
#   Keep both ports on LAN / Tailscale only — never public.

services:
  plutus-mcp:
    # Pre-built image (GHCR). `docker compose pull` fetches this; `--build` uses
    # the local Dockerfile and tags it the same.
    image: ghcr.io/thefrizzy1/mcp-manager:latest
    build: .
    container_name: plutus-mcp
    restart: unless-stopped
    ports:
      - "8765:8765" # MCP endpoint (streamable HTTP)
      - "8766:8766" # Web dashboard
    env_file:
      - .env
    environment:
      - TZ=Europe/Berlin
      # Agent runner: either mount ~/.claude below (interactive login, run once)
      # or bill per-token by uncommenting:
      # - ANTHROPIC_API_KEY=sk-ant-...
    volumes:
      # Docker socket — read-only by default. Powers the Docker/OMV tools.
      # Set DOCKER_WRITE_ENABLED=true in .env to allow start/stop/restart.
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Persistent state: profiles, custom integrations, agent config, schedules,
      # health baseline, recent runs, beta cache, uploaded CA, agent runs.
      # Without these, that state is lost on rebuild.
      - ./config:/app/config
      - ./data:/app/data

      # NON-DESTRUCTIVE UPDATES: settings saved from the UI are written to
      # /app/.env, so mount the host .env here to keep them across an update
      # (`docker compose pull && up -d` recreates the container). Without this
      # bind mount, UI-configured keys/URLs/tokens reset on every update.
      # The host file must exist first (the quickstart's `cp .env.example .env`).
      - ./.env:/app/.env

      # Provider CLI logins for the headless agent runner — these survive
      # `docker compose up -d`, which otherwise recreates the container and
      # discards anything written outside a mount.
      # Log in once:  docker exec -it plutus-mcp claude   (follow the OAuth link)
      - ~/.claude:/root/.claude
      # Codex writes $CODEX_HOME/auth.json; per-account logins land under ./data
      # instead, but this keeps a plain `docker exec -it plutus-mcp codex` login.
      - ~/.codex:/root/.codex
      # Gemini needs no mount: it is an HTTP provider driven by a free-tier API
      # key (https://aistudio.google.com/apikey), and the key is stored per
      # account under ./data, which is already persisted above.

      # ── Optional: expose host folders to the filesystem tools ──────────────
      # Mount any host path you want the filesystem tools to reach, then add
      # the in-container path to FILESYSTEM_ALLOWED_PATHS in .env. Example
      # (replace with your own NAS path / UUID):
      # - /srv/dev-disk-by-uuid-XXXX/MyShare:/data/myshare:ro
    healthcheck:
      # Probes the UI server-health endpoint, which also verifies the MCP
      # process is alive (503 if not). In MCP-only mode (UI_ENABLED=false)
      # port 8766 isn't served, so the check passes trivially instead of flapping.
      # $$ escapes Compose interpolation so the CONTAINER shell evaluates
      # UI_ENABLED at healthcheck runtime (a single $ would be substituted by
      # Compose at parse time and the container would never see it).
      test:
        [
          "CMD-SHELL",
          '[ "$$UI_ENABLED" = "false" ] || curl -f http://localhost:8766/server/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - plutus_mcp_net

networks:
  plutus_mcp_net:
    driver: bridge
